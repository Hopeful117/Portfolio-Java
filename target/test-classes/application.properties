spring.datasource.url=jdbc:h2:mem:portfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.mongodb.uri=mongodb://localhost:27017/portfolio-test?serverSelectionTimeoutMS=100
spring.mongodb.database=portfolio-test
spring.data.mongodb.auto-index-creation=false
