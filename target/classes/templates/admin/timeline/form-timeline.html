<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">


<th:block th:replace="~{fragments/admin-head :: head('Ajouter une étape du parcours')}"></th:block>


<body>


<div class="admin-layout">


    <th:block th:replace="~{fragments/admin-sidebar :: sidebar}"></th:block>



    <main class="admin-content">


        <th:block th:replace="~{fragments/admin-header :: header('Ajouter une étape du parcours')}"></th:block>




        <section class="card-admin form-card">


            <form th:action="@{/admin/timeline}"
                  th:object="${timelineEntry}"
                  method="post">





                <div class="form-group">


                    <label for="title">
                        Titre
                    </label>


                    <input id="title"
                           type="text"
                           th:field="*{title}"
                           class="input-admin"
                           placeholder="Ex : Certification CS50x">


                </div>






                <div class="form-group">


                    <label for="type">
                        Type
                    </label>


                    <select id="type"
                            th:field="*{type}"
                            class="select-admin">


                        <option value="">
                            -- Sélectionner un type --
                        </option>


                        <option th:each="type : ${timelineTypes}"
                                th:value="${type}"
                                th:text="${type}">
                        </option>


                    </select>


                </div>







                <div class="form-group">


                    <label for="date">
                        Date
                    </label>


                    <input id="date"
                           type="date"
                           th:field="*{date}"
                           class="input-admin">


                </div>







                <div class="form-group">


                    <label for="description">
                        Description
                    </label>


                    <textarea id="description"
                              th:field="*{description}"
                              rows="5"
                              class="textarea-admin"
                              placeholder="Décrivez cette étape de votre parcours...">
                    </textarea>


                </div>







                <div class="form-group">


                    <label for="link">
                        Lien (optionnel)
                    </label>


                    <input id="link"
                           type="url"
                           th:field="*{link}"
                           class="input-admin"
                           placeholder="https://...">


                </div>







                <div class="form-group">


                    <label for="displayOrder">
                        Ordre d'affichage
                    </label>


                    <input id="displayOrder"
                           type="number"
                           th:field="*{displayOrder}"
                           class="input-admin"
                           min="1">


                </div>







                <div class="form-actions">


                    <button type="submit"
                            class="btn-admin">

                        <i class="bi bi-check-circle"></i>

                        Enregistrer

                    </button>




                    <a th:href="@{/admin/timeline}"
                       class="btn-secondary-admin">

                        Annuler

                    </a>


                </div>





            </form>


        </section>



    </main>



</div>



</body>

</html>
