<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">


<th:block th:replace="~{fragments/admin-head :: head('Ajouter un projet')}"></th:block>


<body>


<div class="admin-layout">


    <th:block th:replace="~{fragments/admin-sidebar :: sidebar}"></th:block>



    <main class="admin-content">


        <th:block th:replace="~{fragments/admin-header :: header('Ajouter un projet')}"></th:block>




        <section class="card-admin form-card">



            <form th:action="@{/admin/projects}"
                  th:object="${projects}"
                  method="post"
                  enctype="multipart/form-data">





                <div class="form-group">


                    <label for="title">
                        Titre
                    </label>


                    <input id="title"
                           type="text"
                           class="input-admin"
                           th:field="*{title}">


                </div>





                <div class="form-group">


                    <label for="description">
                        Description
                    </label>


                    <textarea id="description"
                              class="textarea-admin"
                              rows="5"
                              th:field="*{description}">
                    </textarea>


                </div>





                <div class="form-group">


                    <div class="form-header">


                        <label>
                            Technologies
                        </label>



                        <a th:href="@{/admin/technologies}"
                           class="btn-secondary-admin">

                            <i class="bi bi-plus-circle"></i>

                            Ajouter

                        </a>


                    </div>





                    <div class="checkbox-list">


                        <div th:each="technology : ${technologies}"
                             class="checkbox-item">


                            <input class="checkbox-admin"
                                   type="checkbox"
                                   th:field="*{technologies}"
                                   th:value="${technology.id}">


                            <label th:text="${technology.name}">
                                Java
                            </label>


                        </div>


                    </div>



                </div>






                <div class="form-group">


                    <label>
                        Image
                    </label>


                    <input type="file"
                           class="input-admin"
                           name="image"
                           th:field="*{image}">


                </div>






                <div class="form-group">


                    <label>
                        GitHub URL
                    </label>


                    <input type="text"
                           class="input-admin"
                           th:field="*{githubUrl}">


                </div>






                <div class="form-actions">


                    <button type="submit"
                            class="btn-admin">


                        <i class="bi bi-check-circle"></i>

                        Enregistrer


                    </button>




                    <a th:href="@{/admin/projects}"
                       class="btn-secondary-admin">

                        Annuler

                    </a>



                </div>





            </form>



        </section>



    </main>



</div>



</body>

</html>
