<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/admin-head :: head('Gestion projets')}"></th:block>

<body>

<div class="admin-layout">

    <!-- Sidebar -->
    <th:block th:replace="~{fragments/admin-sidebar :: sidebar}"></th:block>


    <main class="admin-content">

        <!-- Header -->
        <th:block th:replace="~{fragments/admin-header :: header('Projects')}"></th:block>


        <section class="page-actions">

            <a th:href="@{/admin/projects/add}"
               class="btn-admin">

                <i class="bi bi-plus-circle"></i>
                Ajouter un projet

            </a>

        </section>


        <section class="card-admin table-card">


            <table class="admin-table">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Description</th>
                    <th>Technologies</th>
                    <th>Actions</th>
                </tr>

                </thead>


                <tbody>


                <tr th:each="project : ${projects}">


                    <td th:text="${project.id}"></td>


                    <td>

                        <strong th:text="${project.title}"></strong>

                    </td>


                    <td th:text="${project.description}"></td>


                    <td>

                        <span th:each="tech : ${project.technologies}"
                              class="badge-admin"
                              th:text="${tech.name}">
                        </span>

                    </td>


                    <td class="actions">


                        <a class="btn-admin btn-small"
                           th:href="@{'/admin/projects/edit/' + ${project.id}}">

                            <i class="bi bi-pencil"></i>
                            Modifier

                        </a>


                        <a class="btn-danger"
                           th:href="@{'/admin/projects/delete/' + ${project.id}}"
                           onclick="return confirm('Supprimer ce projet ?');">

                            <i class="bi bi-trash"></i>
                            Supprimer

                        </a>


                    </td>


                </tr>


                </tbody>


            </table>


        </section>


    </main>


</div>


</body>
</html>
