<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">


<th:block th:replace="~{fragments/admin-head :: head('Ajouter une technologie')}"></th:block>


<body>


<div class="admin-layout">


    <th:block th:replace="~{fragments/admin-sidebar :: sidebar}"></th:block>




    <main class="admin-content">


        <th:block th:replace="~{fragments/admin-header :: header('Ajouter une technologie')}"></th:block>




        <section class="card-admin form-card">


            <form th:action="@{/admin/technologies}"
                  th:object="${technologies}"
                  method="post">





                <div class="form-group">


                    <label for="name">
                        Nom
                    </label>


                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           class="input-admin">


                </div>





                <div class="form-group">


                    <label for="iconeUrl">
                        Icône URL
                    </label>


                    <input id="iconeUrl"
                           type="url"
                           th:field="*{iconeUrl}"
                           class="input-admin">


                </div>






                <div class="form-actions">


                    <button type="submit"
                            class="btn-admin">


                        <i class="bi bi-check-circle"></i>

                        Enregistrer


                    </button>




                    <a th:href="@{/admin/technologies}"
                       class="btn-secondary-admin">

                        Annuler

                    </a>



                </div>




            </form>


        </section>


    </main>


</div>


</body>

</html>
