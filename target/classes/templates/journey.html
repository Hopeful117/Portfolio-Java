<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{fragments/head :: head('Journey')}"></th:block>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<section id="parcours" class="mt-5">

    <h2 class="mb-4">Parcours</h2>

    <div th:each="entry : ${timelineEntries}"
         class="card mb-3 shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between">

                <h5 th:text="${entry.title}"></h5>

                <span class="badge text-bg-secondary"
                      th:text="${entry.type}">
                </span>

            </div>

            <p class="text-muted"
               th:text="${#temporals.format(entry.date,'MM/yyyy')}">
            </p>

            <p th:text="${entry.description}"></p>

            <a th:if="${entry.link != null && !entry.link.isBlank()}"
               th:href="${entry.link}"
               target="_blank"
               class="btn btn-outline-primary btn-sm">
                Voir le certificat
            </a>

        </div>

    </div>

</section>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
