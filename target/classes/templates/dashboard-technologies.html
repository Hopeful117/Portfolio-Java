<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/head :: head('Gestion technologies')}"></th:block>

<body>

<div class="container mt-4">


    <h2>Dashboard Admin - Technologies</h2>
    <a th:href="@{/admin/technologies/add}" class="btn btn-primary">Ajouter une technologie</a>

    <table class="table table-striped table-hover mt-3">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>CDN icone</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="tech : ${technologies}">

            <td th:text="${tech.id}"></td>

            <td th:text="${tech.name}"></td>

            <td th:text="${tech.iconeUrl}"></td>



            <td>

                <a class="btn btn-primary btn-sm"
                   th:href="@{'/admin/technologies/edit/' + ${tech.id}}">
                    Modifier
                </a>
                <a class="btn btn-danger btn-sm"
                   th:href="@{'/admin/technologies/delete/' + ${tech.id}}"
                   onclick="return confirm('Supprimer cette étape ?');">
                    Supprimer
                </a>

            </td>

        </tr>

        </tbody>
    </table>
    <a th:href="@{/admin/dashboard}" class="btn btn-danger">Retour</a>
</div>




</body>
</html>
