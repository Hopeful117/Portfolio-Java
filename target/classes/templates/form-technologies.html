<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{fragments/head :: head('dashboard projets')}"></th:block>
<body>
<h2 class="h2">Ajouter une technologie</h2>
<form th:action="@{/admin/technologies}" th:object="${technologies}" method="post">
    <div class="mb-3">
    <label class="form-label">Nom
        <input type="text" th:field="*{name}" class="form-control">
    </label>
    </div>

    <div class="mb-3">
    <label class="form-label">Icone
        <input type="url" th:field="*{iconeUrl}" class="form-control">
    </label>
    </div>
</form>

</body>
</html>
