<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/head :: head('Projets')}"></th:block>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container my-5">


        <h1 class="mb-4">
            Mes projets
        </h1>


        <div class="row">

            <div class="col-md-6 mb-4"
                 th:each="project : ${projects}">

                <div class="card">

                    <div class="card-body">

                        <h4 class="card-header" th:text="${project.title}">
                            Titre
                        </h4>

                        <p class="card-text" th:text="${project.description}">
                            Description
                        </p>
                        <div>
                            <img th:src="${project.imagePath}" class="card-img-top">
                        </div>

                        <div class="my-5 ">
                            <strong>Technologies :</strong>
                        <div class="d-flex justify-content-center gap-3">
                        <div  th:each="tech : ${project.technologies}" >

                            <img th:src="${tech.iconeUrl}"
                                 th:alt="${tech.name}"
                                 width="64"
                                 height="64"
                                 class="my-5"
                            />



                        </div>
                        </div>
                        </div>



                        <a th:href="${project.githubUrl}"
                           target="_blank"
                           class="btn btn-dark">

                            GitHub

                        </a>



                </div>

            </div>



    </div>
        </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
