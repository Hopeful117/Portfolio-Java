<!DOCTYPE html>
<html lang="en">
<th:block th:replace="~{fragments/head :: head('Projets')}"></th:block>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <div class="container mt-5">

        <h1 class="mb-4">
            Mes projets
        </h1>


        <div class="row">

            <div class="col-md-6 mb-4"
                 th:each="project : ${projects}">

                <div class="card h-100">

                    <div class="card-body">

                        <h4 th:text="${project.title}">
                            Titre
                        </h4>

                        <p th:text="${project.description}">
                            Description
                        </p>
                        <div>
                            <img th:src="${project.imagePath}">
                        </div>

                        <p>
                            <strong>Technologies :</strong>
                        </p>
                        <div th:each="tech : ${project.technologies}" class="tech-item">

                            <img th:src="${tech.iconeUrl}"
                                 th:alt="${tech.name}"
                                 width="128"
                                 height="128"
                            />



                        </div>

                     

                        <a th:href="${project.githubUrl}"
                           target="_blank"
                           class="btn btn-dark">

                            GitHub

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
