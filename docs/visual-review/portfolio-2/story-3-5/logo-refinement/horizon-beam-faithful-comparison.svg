  <text x="155" y="936" class="display" fill="#70a7ff" font-size="18" font-weight="800">Ludovic Brot</text>
  <text x="155" y="959" class="mono" fill="#718096" font-size="12">Software &amp; AI Engineer</text>
  <text x="1090" y="946" class="mono" fill="#aab6c5" font-size="13">Home   Work   Writing   Skills   Journey   Contact</text>

  <text x="64" y="1040" class="display" fill="#e9eef5" font-size="16" font-weight="800">VISUAL CHECK</text>
  <text x="64" y="1068" class="mono" fill="#aab6c5" font-size="13">horizon ✓   beam emergence ✓   central light ✓   controlled luminosity ✓   depth ✓   professional ✓   small-size recognition ✓   header presence ✓</text>
  <text x="64" y="1095" class="mono" fill="#718096" font-size="12">DECISION REQUIRED: ACCEPT FAITHFUL HORIZON–BEAM  /  REQUEST REFINEMENT</text>
