    <path d="M-25 9C-13-7 13-7 25 9" fill="none" stroke="#70a7ff" stroke-width="5.5" opacity=".2"/>
    <path d="M-25 9C-13-7 13-7 25 9" fill="none" stroke="url(#horizon)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M0-25L2.5-2L0 10L-2.5-2Z" fill="url(#beam)"/><path d="M0 1L3 7L0 13L-3 7Z" fill="#f4fbff"/><path d="M-.7 11H.7L1.5 19H-1.5Z" fill="#70a7ff"/>
  </g>
  <g transform="translate(1145 650) scale(1.75)">
    <path d="M-25 9C-13-7 13-7 25 9" fill="none" stroke="#70a7ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M0-25L3-3L0 10L-3-3Z" fill="#e9eef5"/><path d="M-1.5 9H1.5V20H-1.5Z" fill="#70a7ff"/>
  </g>

  <rect x="48" y="794" width="1304" height="190" rx="14" class="panel"/>
  <text x="80" y="836" class="display label">PRIMARY IN THE ACTUAL PORTFOLIO HEADER</text>
  <text x="80" y="861" class="display note">review capture uses the real lockup, descriptor, graphite/slate shell, Typography A, and navigation</text>
  <line x1="80" y1="900" x2="1320" y2="900" stroke="#2d3a4b"/>
  <g transform="translate(112 934) scale(.72)">
    <ellipse cx="0" cy="8" rx="32" ry="15" fill="url(#origin)" opacity=".8" filter="url(#small-blur)"/>
    <path d="M-44 8C-23-20 23-20 44 8" fill="none" stroke="#70a7ff" stroke-width="9" opacity=".16"/>
    <path d="M-44 8C-23-20 23-20 44 8" fill="none" stroke="url(#horizon)" stroke-width="6" stroke-linecap="round"/>
    <path d="M0-36L2.3-1L0 10L-2.3-1Z" fill="url(#beam)"/><path d="M0 0L3 7L0 14L-3 7Z" fill="#f4fbff"/><path d="M-.8 11H.8L2 26H-2Z" fill="#70a7ff"/>
