<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/head :: head('Gestion projects')}"></th:block>

<body>

<div class="container mt-4">


    <h2>Dashboard Admin - Projets</h2>
    <a th:href="@{/admin/projects/add}" class="btn btn-primary">Ajouter un projet</a>

    <table class="table table-striped table-hover mt-3">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Titre</th>
            <th>Description</th>
            <th>Technologies</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="project : ${projects}">

            <td th:text="${project.id}"></td>

            <td th:text="${project.title}"></td>

            <td th:text="${project.description}"></td>

            <td>
                <span th:each="tech : ${project.technologies}"
                      class="badge bg-secondary me-1"
                      th:text="${tech.name}">
                </span>
            </td>


            <td>

                <a class="btn btn-primary btn-sm"
                   th:href="@{'/admin/projects/edit/' + ${project.id}}">
                    Modifier
                </a>

            </td>

        </tr>

        </tbody>
    </table>
    <a th:href="@{/admin/dashboard}" class="btn btn-danger">Retour</a>
</div>




</body>
</html>
