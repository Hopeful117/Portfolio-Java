<!DOCTYPE html>
<html lang="en">
<th:block th:replace="~{fragments/head :: head('dashboard projets')}"></th:block>
<body>
<h2 class="h2">Ajouter un projet</h2>
<form th:action="@{/admin/projects}" th:object="${projects}" method="post">


        <div class="mb-3">
            <label class="form-label">Titre</label>
            <input type="text" class="form-control" th:field="*{title}">
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control"
                      th:field="*{description}"></textarea>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
                <label class="form-label mb-0">Technologies</label>

                <!-- Bouton d'ajout -->
                <a th:href="@{/admin/technologies}"
                   class="btn btn-sm btn-outline-primary">
                    + Ajouter une technologie
                </a>
            </div>

            <div class="mt-2" th:each="technology : ${technologies}">
                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{technologies}"
                           th:value="${technology.id}">

                    <label class="form-check-label"
                           th:text="${technology.name}">
                        Java
                    </label>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="text"
                   class="form-control"
                   th:field="*{imageUrl}">
        </div>

        <div class="mb-3">
            <label class="form-label">GitHub URL</label>
            <input type="text"
                   class="form-control"
                   th:field="*{githubUrl}">
        </div>

        <button type="submit" class="btn btn-primary">
            Enregistrer
        </button>



</form>

</body>
</html>
