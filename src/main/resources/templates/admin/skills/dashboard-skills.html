<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/admin-head :: head('Gestion compétences')}"></th:block>

<body>

<div class="admin-layout">


    <th:block th:replace="~{fragments/admin-sidebar :: sidebar}"></th:block>


    <main class="admin-content">


        <th:block th:replace="~{fragments/admin-header :: header('Skills')}"></th:block>


        <section class="page-actions">

            <a th:href="@{/admin/skills/add}"
               class="btn-admin">

                <i class="bi bi-plus-circle"></i>
                Ajouter une compétence

            </a>

        </section>


        <section class="card-admin table-card">


            <table class="admin-table">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Catégorie</th>
                    <th>Niveau</th>
                    <th>Actions</th>
                </tr>

                </thead>


                <tbody>


                <tr th:each="skill : ${skills}">


                    <td th:text="${skill.id}"></td>


                    <td>

                        <strong th:text="${skill.name}"></strong>

                    </td>


                    <td>

                        <span class="badge-admin"
                              th:text="${skill.category}">
                        </span>

                    </td>


                    <td>

                        <span class="skill-level"
                              th:text="${skill.skillLevel}">
                        </span>

                    </td>


                    <td class="actions">


                        <a class="btn-admin btn-small"
                           th:href="@{'/admin/skills/edit/' + ${skill.id}}">

                            <i class="bi bi-pencil"></i>
                            Modifier

                        </a>


                        <a class="btn-danger"
                           th:href="@{'/admin/skills/delete/' + ${skill.id}}"
                           onclick="return confirm('Supprimer cette compétence ?');">

                            <i class="bi bi-trash"></i>
                            Supprimer

                        </a>


                    </td>


                </tr>


                </tbody>


            </table>


        </section>


    </main>


</div>


</body>
</html>
