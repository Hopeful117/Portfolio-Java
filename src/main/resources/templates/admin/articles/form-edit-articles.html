<!DOCTYPE html>
<html lang="fr">

<th:block th:replace="~{fragments/admin-head :: head('Modifier un article')}"></th:block>

<body>

<div class="admin-layout">


    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>



    <main class="admin-content">


        <div class="form-card card-admin">


            <div class="form-header">

                <h1>
                    Modifier un article
                </h1>

            </div>




            <form th:action="@{/admin/articles/edit/{id}(id=${article.id})}"
                  th:object="${article}"
                  method="post"
                  enctype="multipart/form-data"
            >



                <input type="hidden"
                       th:field="*{id}">





                <div class="form-group">

                    <label>
                        Titre
                    </label>

                    <input type="text"
                           th:field="*{title}"
                           class="input-admin">

                </div>





                <div class="form-group">

                    <label>
                        Slug
                    </label>

                    <input type="text"
                           th:field="*{slug}"
                           class="input-admin">

                </div>





                <div class="form-group">

                    <label>
                        Résumé
                    </label>


                    <textarea th:field="*{excerpt}"
                              class="textarea-admin"
                              rows="3">
                    </textarea>


                </div>






                <div class="form-group">

                    <label>
                        Contenu
                    </label>


                    <textarea th:field="*{content}"
                              class="textarea-admin"
                              rows="12">
                    </textarea>


                </div>






                <div class="form-group">

                    <label>
                        Image de couverture
                    </label>


                    <input type="file"
                           name="image"
                           class="input-admin"
                           placeholder="URL de l'image">


                </div>







                <div class="form-group">

                    <label>
                        Tags
                    </label>


                    <input type="text"
                           th:field="*{tags}"
                           class="input-admin">


                </div>







                <div class="checkbox-item">


                    <input type="checkbox"
                           th:field="*{published}"
                           class="checkbox-admin">


                    <label>
                        Article publié
                    </label>


                </div>







                <div class="form-actions">


                    <button type="submit"
                            class="btn-admin-primary">

                        Enregistrer

                    </button>




                    <a th:href="@{/admin/articles}"
                       class="btn-secondary-admin">

                        Annuler

                    </a>


                </div>



            </form>



        </div>



    </main>



</div>


</body>
</html>
