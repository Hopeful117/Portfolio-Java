<!DOCTYPE html>
<html lang="en">
<th:block th:replace="~{fragments/head :: head('Skills')}"></th:block>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">

    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">Compétences</h1>
        <p class="text-muted">
            Technologies et outils que j'utilise au quotidien.
        </p>
    </div>

    <div class="row g-4">

        <div class="col-12"
             th:each="group : ${skillCategories}">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-dark text-white">
                    <h2 class="h4 mb-0"
                        th:text="${group.category()}">
                    </h2>
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-md-6 col-lg-4"
                             th:each="skill : ${group.skills()}">

                            <div class="card h-100 border-light shadow-sm">

                                <div class="card-body">

                                    <h5 class="card-title fw-bold"
                                        th:text="${skill.name}">
                                    </h5>

                                    <span class="badge rounded-pill text-bg-primary"
                                          th:text="${skill.skillLevel}">
                                    </span>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
