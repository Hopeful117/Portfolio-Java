<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/head :: head('Gestion technologies')}"></th:block>

<body>

<div class="container mt-4">


    <h2>Dashboard Admin - Skills</h2>
    <a th:href="@{/admin/skills/add}" class="btn btn-primary">Ajouter une compétence</a>

    <table class="table table-striped table-hover mt-3">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Categorie</th>
            <th>Niveau</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="skill : ${skills}">

            <td th:text="${skill.id}"></td>

            <td th:text="${skill.name}"></td>

            <td th:text="${skill.category}"></td>

            <td th:text="${skill.skillLevel}"></td>




            <td>

                <a class="btn btn-primary btn-sm"
                   th:href="@{'/admin/skills/edit/' + ${skill.id}}">
                    Modifier
                </a>

            </td>

        </tr>

        </tbody>
    </table>
    <a th:href="@{/admin/dashboard}" class="btn btn-danger">Retour</a>
</div>




</body>
</html>
