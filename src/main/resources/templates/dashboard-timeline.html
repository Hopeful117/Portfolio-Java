<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/admin-head :: head('Gestion parcours')}"></th:block>

<body>

<div class="admin-layout">


    <th:block th:replace="~{fragments/admin-sidebar :: sidebar}"></th:block>


    <main class="admin-content">


        <th:block th:replace="~{fragments/admin-header :: header('Timeline')}"></th:block>


        <section class="page-actions">

            <a th:href="@{/admin/timeline/add}"
               class="btn-admin">

                <i class="bi bi-plus-circle"></i>
                Ajouter une étape

            </a>

        </section>


        <section class="card-admin table-card">


            <table class="admin-table">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Lien</th>
                    <th>Ordre</th>
                    <th>Actions</th>
                </tr>

                </thead>


                <tbody>


                <tr th:each="entry : ${timelineEntries}">


                    <td th:text="${entry.id}"></td>


                    <td>

                        <strong th:text="${entry.title}"></strong>

                    </td>


                    <td>

                        <span class="badge-admin"
                              th:classappend="
                              ${entry.type.name() == 'CERTIFICATION'} ? ' badge-success' :
                              (${entry.type.name() == 'EDUCATION'} ? ' badge-primary' :
                              (${entry.type.name() == 'PROJECT'} ? ' badge-warning' :
                              ' badge-secondary'))"
                              th:text="${entry.type}">
                        </span>

                    </td>


                    <td th:text="${#temporals.format(entry.date, 'dd/MM/yyyy')}"></td>


                    <td>

                        <a th:if="${entry.link != null && !entry.link.isBlank()}"
                           th:href="${entry.link}"
                           target="_blank"
                           class="btn-link-admin">

                            <i class="bi bi-box-arrow-up-right"></i>
                            Voir

                        </a>


                        <span th:unless="${entry.link != null && !entry.link.isBlank()}">
                            —
                        </span>

                    </td>


                    <td th:text="${entry.displayOrder}"></td>


                    <td class="actions">


                        <a class="btn-admin btn-small"
                           th:href="@{'/admin/timeline/edit/' + ${entry.id}}">

                            <i class="bi bi-pencil"></i>
                            Modifier

                        </a>


                        <a class="btn-danger"
                           th:href="@{'/admin/timeline/delete/' + ${entry.id}}"
                           onclick="return confirm('Supprimer cette étape ?');">

                            <i class="bi bi-trash"></i>
                            Supprimer

                        </a>


                    </td>


                </tr>


                </tbody>


            </table>


        </section>


    </main>


</div>


</body>
</html>
