<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/head :: head('Gestion parcours')}"></th:block>

<body>

<div class="container mt-4">

    <h2>Dashboard Admin - Parcours</h2>

    <a th:href="@{/admin/timeline/add}"
       class="btn btn-primary">
        Ajouter une étape
    </a>

    <table class="table table-striped table-hover mt-3">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Titre</th>
            <th>Type</th>
            <th>Date</th>
            <th>Lien</th>
            <th>Ordre</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="entry : ${timelineEntries}">

            <td th:text="${entry.id}"></td>

            <td th:text="${entry.title}"></td>

            <td>
                <span class="badge"
                      th:classappend="
                        ${entry.type.name() == 'CERTIFICATION'} ? ' text-bg-success' :
                        (${entry.type.name() == 'EDUCATION'} ? ' text-bg-primary' :
                        (${entry.type.name() == 'PROJECT'} ? ' text-bg-warning' :
                        ' text-bg-secondary'))"
                      th:text="${entry.type}">
                </span>
            </td>

            <td th:text="${#temporals.format(entry.date, 'dd/MM/yyyy')}"></td>

            <td>
                <a th:if="${entry.link != null && !entry.link.isBlank()}"
                   th:href="${entry.link}"
                   target="_blank"
                   class="btn btn-outline-info btn-sm">
                    Voir
                </a>

                <span th:unless="${entry.link != null && !entry.link.isBlank()}">
                    —
                </span>
            </td>

            <td th:text="${entry.displayOrder}"></td>

            <td>

                <a class="btn btn-primary btn-sm"
                   th:href="@{'/admin/timeline/edit/' + ${entry.id}}">
                    Modifier
                </a>

                <a class="btn btn-danger btn-sm"
                   th:href="@{'/admin/timeline/delete/' + ${entry.id}}"
                   onclick="return confirm('Supprimer cette étape ?');">
                    Supprimer
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <a th:href="@{/admin/dashboard}"
       class="btn btn-danger">
        Retour
    </a>

</div>

</body>
</html>
