services:

  postgres:
    image: postgres:17

    container_name: portfolio-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
     - portfolio-network

    restart: unless-stopped



    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d


  mongodb:
    image: mongo:6
    container_name: mongodb
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio-network

    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1" ]
      interval: 5s
      timeout: 5s
      retries: 12

    restart: unless-stopped



  portfolio:
    build: .

    container_name: portfolio-app

    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_URI: ${MONGO_URI}

    networks:
      - portfolio-network
    
    volumes:
      - uploads:/app/uploads


    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: portfolio-frontend

    environment:
      API_ORIGIN: http://portfolio:8080
      PORT: 4000
      NG_ALLOWED_HOSTS: ludovic-brot.fr,www.ludovic-brot.fr,localhost,127.0.0.1
      NG_TRUST_PROXY_HEADERS: X-FORWARDED-FOR,X-FORWARDED-PROTO

    depends_on:
      portfolio:
        condition: service_healthy

    expose:
      - "4000"

    networks:
      - portfolio-network

    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx

    ports:
      - "127.0.0.1:${NGINX_PORT:-8081}:80"

    depends_on:
      portfolio:
        condition: service_healthy
      frontend:
        condition: service_healthy

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - portfolio-network

    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  mongo_data:


networks:
  portfolio-network:
    driver: bridge
