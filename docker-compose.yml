services:

  postgres:
    image: postgres:17

    container_name: portfolio-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
     - portfolio-network

    restart: unless-stopped



    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d


  mongodb:
    image: mongo:6
    container_name: mongodb
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio-network


    restart: unless-stopped



  portfolio:
    build: .

    container_name: portfolio-app

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_URI: ${MONGO_URI}

    networks:
      - portfolio-network
    
    volumes:
      - uploads:/app/uploads


    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  mongo_data:


networks:
  portfolio-network:
    driver: bridge
